name: WAY UP Studio · Motor final (aislado)
on:
  push:
    branches:
      - feature/studio-final-motor-estructura-medios-20261115
  workflow_dispatch:
permissions:
  contents: write
jobs:
  motor-final:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: studio-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Tests de motor HTML, ZIP, archivos y agentes
        run: npm test
      - name: Pruebas del backend SaaS aislado (sin desplegar)
        working-directory: .
        run: node --check src/studio-next-projects-bridge.js && node --check src/studio-next-own-agents-bridge.js && node --check src/studio-public-agent-worker.js && node --check src/studio-next-webcreator-bridge.js && node --check scripts/patch-studio-next-agent-preview.mjs && node --test tests/studio-next-projects-bridge.test.mjs tests/studio-agents-sso-integration.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Compilar editor (sin publicar)
        run: npm run build
      - name: Empaquetar artefactos de la preview nueva
        run: node scripts/package-worker-preview.mjs
      - name: Guardar artefactos compilados en esta rama de desarrollo
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-artifacts/wayapp-editor/
          if ! git diff --cached --quiet; then
            git commit -m "build(studio): artefactos validados del motor final [skip ci]"
            git push origin HEAD:feature/studio-final-motor-estructura-medios-20261115
          fi
      - name: Entregar compilación estática para pruebas
        uses: actions/upload-artifact@v4
        with:
          name: wayup-studio-final-preview
          path: studio-next/out
          retention-days: 7

