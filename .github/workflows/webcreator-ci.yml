name: WebCreator quality gate
on:
  push:
    branches:
      - feature/studio-reliability-hardening
      - feature/compact-one-screen
      - feature/precision-dark-ui
  pull_request:
    branches:
      - main
      - feature/biblioteca-canvas
permissions:
  contents: read
jobs:
  check:
    name: Build and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test Worker
        run: npm run check
